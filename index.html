<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EuphoriaJS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; font-family: monospace; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px;
      color: #e0e0e0; font-size: 11px; line-height: 1.6;
      /* the HUD is written with newlines and read as text, not markup */
      white-space: pre;
      background: rgba(0,0,0,0.55); padding: 8px 12px;
      border-radius: 4px; border-left: 2px solid #4af;
      pointer-events: none;
    }
    #crosshair {
      position: fixed; top: 50%; left: 58%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      border: 1.5px solid rgba(40,40,45,0.75);
      border-radius: 50%; pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute;
      background: rgba(40,40,45,0.6);
    }
    #crosshair::before { width: 1px; height: 6px; left: 3.5px; top: -8px; }
    #crosshair::after  { width: 6px; height: 1px; top: 3.5px; left: -8px; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff; color: #55555c; font-size: 14px; gap: 16px;
    }
    #progress-bar {
      width: 260px; height: 3px; background: #e2e2e6; border-radius: 2px; overflow: hidden;
    }
    #progress-fill {
      height: 100%; background: #55555c; width: 0%; transition: width 0.2s;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
<div id="loading">
  <div>EuphoriaJS — Loading assets…</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="progress-label" style="font-size:11px;color:#666">0 / 0</div>
</div>
<div id="hud">Loading…</div>
<div id="crosshair"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
